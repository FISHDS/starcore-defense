name: 發布星核防線

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取得遊戲檔案
        uses: actions/checkout@v6
      - name: 準備測試環境
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 執行遊戲測試
        run: npm test
      - name: 執行全關難度試跑
        run: npm run balance
      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上傳遊戲畫面
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: 發布遊戲
        id: deployment
        uses: actions/deploy-pages@v4
